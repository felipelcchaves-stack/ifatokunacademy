# /etc/nginx/sites-available/academy
# SPA estática (build do Vite) servida via symlink 'current' -> release ativo.
# Aplicar em duas etapas: 1) bloco HTTP simples, testar, recarregar;
# 2) só depois rodar certbot --nginx -d academy.ifatokun.com.br (ele reescreve
# este arquivo sozinho acrescentando o bloco HTTPS, preservando estas diretivas).

server {
    listen 80;
    server_name academy.ifatokun.com.br;

    root /home/academy/current;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
